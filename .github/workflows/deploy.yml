name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # argocd-image-updater on nova follows `latest` and rolls each new digest out.
          tags: |
            ghcr.io/domiirl/exploding-kittens:latest
            ghcr.io/domiirl/exploding-kittens:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
